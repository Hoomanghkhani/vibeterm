name: ⚡ VibeTerm CI/CD & Multi-Platform Release

on:
  push:
    branches: [main, master, develop]
    tags:
      - "v*.*.*"
      - "v*"
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  packages: write

env:
  GOTOOLCHAIN: auto

jobs:
  # ----------------------------------------------------------------------------
  # 🧪 Unit Tests & Static Analysis
  # ----------------------------------------------------------------------------
  test:
    name: 🧪 Run Tests & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Install Linux Headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Verify Module Integrity
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v ./...

  # ----------------------------------------------------------------------------
  # 🐧 Linux Build (x86_64)
  # ----------------------------------------------------------------------------
  build-linux:
    name: 🐧 Build Linux x86_64
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Install Linux Desktop Dev Headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Extract Tag / Version
        id: meta
        run: |
          VERSION=${GITHUB_REF_NAME}
          if [[ "${VERSION}" != v* ]]; then
            VERSION="1.0.0-${GITHUB_SHA::8}"
          else
            VERSION=${VERSION#v}
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "commit=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          echo "time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Compile Native Linux App with Wails
        run: |
          wails build -tags webkit2_41 -trimpath -ldflags="-s -w"

      - name: Package Linux Archive (.tar.gz)
        run: |
          mkdir -p dist/release
          tar -czf dist/release/vibeterm-v${{ steps.meta.outputs.version }}-linux-amd64.tar.gz \
            -C build/bin vibeterm \
            README.md

      - name: Upload Linux Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibeterm-linux-amd64
          path: dist/release/*.tar.gz
          retention-days: 7

  # ----------------------------------------------------------------------------
  # 🪟 Windows Build (x86_64 Cross-Compilation)
  # ----------------------------------------------------------------------------
  build-windows:
    name: 🪟 Build Windows x86_64 (.exe)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Install MinGW Cross-Compiler & Wails CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 zip
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Extract Tag / Version
        id: meta
        run: |
          VERSION=${GITHUB_REF_NAME}
          if [[ "${VERSION}" != v* ]]; then
            VERSION="1.0.0-${GITHUB_SHA::8}"
          else
            VERSION=${VERSION#v}
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "commit=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          echo "time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Compile Windows App with Wails
        run: |
          wails build -platform windows/amd64 -trimpath -ldflags="-s -w"

      - name: Package Windows Archive (.zip)
        run: |
          mkdir -p dist/release
          cd build/bin
          zip -j -9 ../../dist/release/vibeterm-v${{ steps.meta.outputs.version }}-windows-amd64.zip \
            vibeterm.exe ../../README.md

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibeterm-windows-amd64
          path: dist/release/*.zip
          retention-days: 7

  # ----------------------------------------------------------------------------
  # 🚀 Automated GitHub Release (On Version Tag v*.*.*)
  # ----------------------------------------------------------------------------
  publish-release:
    name: 🚀 Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Linux x86_64 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: vibeterm-linux-amd64
          path: release-assets/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: vibeterm-windows-amd64
          path: release-assets/

      - name: Compute SHA256 Checksums
        run: |
          cd release-assets
          sha256sum *.tar.gz *.zip > checksums.txt
          echo "=== Computed Checksums ==="
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
